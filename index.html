<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>果藝所 Smoothie Renaissance｜線上點餐</title>
<style>
  :root{
    /* 60%主色：深棕 */
    --bg:#2F1B1A;
    --card:#3C2724;
    --line:#4E3530;
    /* 30%輔助：酒紅＋米黃 */
    --wine:#640017;
    --cream:#FFFDD9;
    /* 10%點綴：橄欖綠（杯數操作） */
    --olive:#5A5E27;
    --muted:#B9AE9A;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,"PingFang TC","Noto Sans TC",sans-serif;
    background:var(--bg);color:var(--cream);
    max-width:430px;margin:0 auto;
    position:relative;
  }
  .serif{font-family:"Noto Serif TC","PingFang TC",serif}

  /* ===== 畫面切換 ===== */
  .screen{display:none;min-height:100vh;padding-bottom:120px}
  .screen.active{display:block}

  /* ===== 菜單頁 ===== */
  .top{
    display:flex;flex-direction:column;align-items:center;
    padding:26px 16px 12px;
  }
  .top .logo-mark{width:64px;height:auto;display:block}
  .top .logo-en{width:230px;height:auto;display:block;margin-top:12px}
  .top .logo-cn{width:120px;height:auto;display:block;margin-top:8px}
  .promo{
    display:block;width:fit-content;margin:12px auto 0;
    font-size:12px;color:var(--cream);background:var(--wine);
    border-radius:999px;padding:5px 16px;letter-spacing:1px;
  }
  .section-title{
    font-size:14px;letter-spacing:4px;color:var(--muted);
    margin:14px 20px 12px;display:flex;align-items:center;gap:10px;
  }
  .section-title::after{content:"";flex:1;height:1px;background:var(--line)}

  .menu-card{
    background:var(--card);border:1px solid var(--line);
    border-radius:20px;margin:0 16px 14px;overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,.25);
  }
  .menu-card .art{
    height:150px;background-size:cover;background-position:center;
    position:relative;cursor:pointer;
  }
  .menu-card .art .badge{
    position:absolute;right:10px;top:10px;
    background:var(--olive);color:var(--cream);
    min-width:26px;height:26px;border-radius:13px;
    font-size:13px;font-weight:700;
    display:none;align-items:center;justify-content:center;padding:0 9px;
  }
  .menu-card .art .info-hint{
    position:absolute;left:10px;bottom:10px;
    background:rgba(47,27,26,.72);color:var(--cream);
    font-size:11px;letter-spacing:1px;
    border-radius:999px;padding:4px 12px;
  }
  .menu-card .body{
    display:flex;align-items:center;padding:12px 14px;gap:10px;
  }
  .menu-card .t{flex:1;min-width:0;cursor:pointer}
  .menu-card .t .name{font-size:17px;font-weight:700;letter-spacing:1px;color:var(--cream)}
  .menu-card .t .en{font-size:11px;color:var(--muted);margin-top:2px}
  .menu-card .price{text-align:right;margin-right:4px}
  .menu-card .price .orig{font-size:12px;color:var(--muted);text-decoration:line-through;display:block}
  .menu-card .price .now{font-size:17px;font-weight:700;color:var(--cream)}

  /* 卡片上的杯數操作（橄欖綠點綴） */
  .stepper{display:flex;align-items:center;gap:4px;flex-shrink:0}
  .stepper button{
    width:36px;height:36px;border-radius:50%;
    border:none;background:var(--olive);color:var(--cream);
    font-size:19px;line-height:1;cursor:pointer;font-weight:700;
    display:flex;align-items:center;justify-content:center;
  }
  .stepper button:active{filter:brightness(1.2)}
  .stepper .qty{width:30px;text-align:center;font-size:17px;font-weight:700;color:var(--cream)}

  /* ===== 詳情頁（純資訊） ===== */
  .detail-top{
    position:sticky;top:0;z-index:5;
    display:flex;align-items:center;padding:14px 16px 10px;
    background:linear-gradient(var(--bg) 65%,transparent);
  }
  .btn-back{
    width:38px;height:38px;border-radius:50%;
    border:1px solid var(--line);background:var(--card);
    font-size:17px;color:var(--cream);cursor:pointer;
  }
  .hero{
    margin:0 20px;border-radius:22px;overflow:hidden;
    border:6px solid var(--cream);
    box-shadow:0 12px 30px rgba(0,0,0,.4);
  }
  .hero img{width:100%;height:250px;object-fit:cover;display:block}
  .d-head{padding:18px 22px 4px}
  .d-head .name{font-size:24px;font-weight:700;letter-spacing:2px;color:var(--cream)}
  .d-head .en{font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:1px}
  .d-head .desc{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.6}
  .d-head .price{margin-top:10px;font-size:15px}
  .d-head .price .orig{color:var(--muted);text-decoration:line-through;margin-right:8px;font-size:13px}
  .d-head .price .now{color:var(--cream);font-weight:700;font-size:20px}
  .d-head .price .tag{
    font-size:11px;color:var(--cream);background:var(--wine);
    border-radius:999px;padding:2px 10px;margin-left:8px;vertical-align:2px;
  }

  .ing-title{font-size:13px;letter-spacing:3px;color:var(--muted);margin:20px 22px 12px}
  .ing-grid{
    display:grid;grid-template-columns:repeat(2,1fr);
    gap:12px;padding:0 20px 8px;
  }
  .ing{
    background:var(--card);border:1px solid var(--line);
    border-radius:16px;overflow:hidden;text-align:center;
    position:relative;
  }
  .ing .ph{
    width:100%;height:96px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
  }
  .ing .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ing .e{font-size:40px;line-height:1}
  .ing .cap{background:#241514;padding:8px 4px 10px}
  .ing .cap .n{font-size:15px;font-weight:700;color:#fff;letter-spacing:3px}
  .ing .cap .en-s{font-size:9px;color:#D9C9B8;letter-spacing:2px;text-transform:uppercase;margin-top:2px}
  .ing.base{border-color:var(--olive)}
  .ing.base::after{
    content:"基底";position:absolute;top:8px;right:8px;
    background:var(--olive);color:var(--cream);
    font-size:10px;padding:2px 9px;border-radius:999px;letter-spacing:1px;
  }

  /* ===== 底部列（酒紅×米黃輔助） ===== */
  .bar{
    position:fixed;bottom:0;left:50%;transform:translateX(-50%);
    width:100%;max-width:430px;z-index:6;
    background:var(--wine);
    border-radius:16px 16px 0 0;
    box-shadow:0 -4px 14px rgba(0,0,0,.35);
    padding:12px 18px calc(12px + env(safe-area-inset-bottom));
    display:flex;align-items:center;gap:14px;
  }
  .bar .total{flex:1}
  .bar .total .c{font-size:11px;color:#D9C9B8;letter-spacing:1px}
  .bar .total .a{font-size:21px;font-weight:700;color:var(--cream)}
  .bar .cta{
    background:var(--cream);color:var(--wine);border:none;
    font-size:15px;letter-spacing:3px;font-family:inherit;
    padding:14px 26px;border-radius:999px;cursor:pointer;font-weight:700;
  }
  .bar .cta:disabled{background:#8A6A5F;color:#C9B8A8}

  /* ===== 結帳表單（米黃輔助面） ===== */
  .overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.6);
    display:none;align-items:flex-end;justify-content:center;z-index:10;
  }
  .overlay.show{display:flex}
  .sheet{
    background:var(--cream);color:var(--bg);width:100%;max-width:430px;
    border-radius:22px 22px 0 0;
    padding:20px 20px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh;overflow-y:auto;
  }
  .sheet h3{font-size:16px;letter-spacing:3px;margin-bottom:14px;color:var(--wine)}
  .sum{
    background:#FBFAEA;border:1px solid #D9D8A8;border-radius:14px;
    padding:12px 14px;margin-bottom:14px;font-size:14px;
  }
  .sum .row{display:flex;justify-content:space-between;padding:4px 0}
  .sum .row.total{border-top:1px dashed #D9D8A8;margin-top:6px;padding-top:9px;font-weight:700}
  .sum .row.total span:last-child{color:var(--wine)}
  .field{margin-bottom:12px}
  .field label{display:block;font-size:12px;letter-spacing:2px;margin-bottom:5px;color:var(--olive)}
  .field input,.field select,.field textarea{
    width:100%;padding:12px;font-size:16px;
    border:1px solid #D9D8A8;border-radius:12px;
    background:#FBFAEA;color:var(--bg);font-family:inherit;
    appearance:none;-webkit-appearance:none;
  }
  .field textarea{resize:none;height:64px}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--olive)}
  .row2{display:flex;gap:10px}
  .row2 .field{flex:1}
  .sheet .btns{display:flex;gap:10px;margin-top:6px}
  .sheet .btns button{
    flex:1;padding:14px;border-radius:999px;font-size:15px;
    font-family:inherit;letter-spacing:2px;cursor:pointer;
  }
  .btn-line{background:#06C755;color:#fff;border:none;font-weight:700}
  .btn-return{background:#FBFAEA;color:var(--bg);border:1px solid var(--wine)}
  .hint{font-size:11px;color:#8B885F;text-align:center;margin-top:10px;letter-spacing:1px}
  .asap-check{display:flex;align-items:center;gap:9px;font-size:16px;color:var(--bg);margin-bottom:8px}
  .asap-check input{
    appearance:none;-webkit-appearance:none;
    width:18px;height:18px;flex-shrink:0;margin:0;
    border:2px solid var(--olive);border-radius:50%;
    background:#fff;position:relative;cursor:pointer;
  }
  .asap-check input:checked{background:var(--olive)}
  .asap-check input:checked::after{
    content:"";position:absolute;left:50%;top:50%;
    width:6px;height:6px;border-radius:50%;background:#fff;
    transform:translate(-50%,-50%);
  }
  .asap-check span{line-height:1;display:inline-block}
  .asap-check .asap-label{font-weight:700}
  .time-wheels{display:flex;align-items:center;gap:10px;transition:opacity .2s}
  .time-wheels.disabled{opacity:.35;pointer-events:none}
  .time-wheels select{flex:1;text-align:center}
  .time-wheels .colon{font-size:18px;font-weight:700;color:var(--wine)}
  .member-bar{
    display:flex;align-items:center;justify-content:center;gap:10px;
    background:var(--wine);color:#fff;
    font-size:14px;letter-spacing:2px;
    margin:16px -20px calc(-20px - env(safe-area-inset-bottom));
    padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  }
  .member-bar img{height:22px;width:22px;object-fit:contain}
</style>
</head>
<body>

<!-- ========== 菜單頁 ========== -->
<div class="screen active" id="scMenu">
  <div class="top">
    <img class="logo-mark" src="images/logo-mark.png" alt="果藝所 logo">
    <img class="logo-en" src="images/logo-en.svg" alt="Smoothie Renaissance">
    <img class="logo-cn" src="images/logo-cn.svg" alt="果藝所">
  </div>
  <div class="section-title serif">本季畫作</div>
  <div id="menuList"></div>
</div>

<!-- ========== 詳情頁（口味與成份資訊） ========== -->
<div class="screen" id="scDetail">
  <div class="detail-top">
    <button class="btn-back" onclick="showMenu()">←</button>
  </div>
  <div class="hero"><img id="dImg" alt=""></div>
  <div class="d-head">
    <div class="name serif" id="dName"></div>
    <div class="en" id="dEn"></div>
    <div class="desc" id="dDesc"></div>
    <div class="price" id="dPrice"></div>
  </div>
  <div class="ing-title serif">成 份</div>
  <div class="ing-grid" id="dIngs"></div>
</div>

<!-- ========== 底部列 ========== -->
<div class="bar" id="bar">
  <div class="total">
    <div class="c" id="barCups">共 0 杯</div>
    <div class="a" id="barAmt">$0</div>
  </div>
  <button class="cta" id="barBtn" disabled>送出訂單</button>
</div>

<!-- ========== 結帳表單 ========== -->
<div class="overlay" id="overlay">
  <div class="sheet">
    <h3 class="serif">確認您的訂單</h3>
    <div class="sum" id="orderSum"></div>
    <div class="row2">
      <div class="field">
        <label>姓名</label>
        <input type="text" id="fName" placeholder="怎麼稱呼您">
      </div>
      <div class="field">
        <label>電話</label>
        <input type="tel" id="fPhone" placeholder="09xx-xxx-xxx">
      </div>
    </div>
    <div class="field">
      <label>理想預計取餐時間</label>
      <label class="asap-check">
        <input type="checkbox" id="fAsap" checked> <span class="asap-label">儘快取餐（現場稍後）</span>
      </label>
      <div class="time-wheels disabled" id="timeWheels">
        <select id="fHour"></select>
        <span class="colon">：</span>
        <select id="fMinute"></select>
      </div>
    </div>
    <div class="field">
      <label>備註</label>
      <textarea id="fNote"></textarea>
    </div>
    <div class="btns">
      <button class="btn-return" onclick="closeSheet()">返回修改</button>
      <button class="btn-line" id="btnSend">用 LINE 傳送</button>
    </div>
    <p class="hint">送出後將開啟 LINE 聊天室，按下傳送即完成訂購 🖼️</p>
    <div class="member-bar">
      <img src="images/aoc-logo.png" alt="格鬥藝術">格鬥藝術學員訂購享有果藝所專屬折扣
    </div>
  </div>
</div>

<script>
/* ================= 店家設定（只需要改這一區） ================= */
const CONFIG = {
  // 你的官方帳號 ID（含@），到 LINE Official Account Manager 首頁可查
  OA_ID: "@507mmuio",

  // true = 顯示優惠價（salePrice）；平常為 false，顯示一般價
  // 會員折扣不在線上處理：結帳頁底部有專屬折扣提示色塊
  OPENING_SALE: false,

  // 營業取餐時段（24小時制）與間隔（分鐘）
  OPEN_HOUR: 11,
  CLOSE_HOUR: 22,
  SLOT_MINUTES: 15,

  // 菜單：price=一般價（網頁顯示）、salePrice=會員價（現場折扣參考，OPENING_SALE 為 true 時才會顯示）
  // img：四張畫作圖片放在 images 資料夾
  // ings：成分名稱（不含克數）；base:true 代表基底
  // 成分照片放 images/ings/，檔名＝英文名小寫去空格.jpg（如 bananas.jpg、dragonfruit.jpg）；缺照片時顯示 emoji
  MENU: [
    { name: "印象日出", en: "Impression Sunrise", price: 160, salePrice: 155,
      desc: "如莫內晨霧中的暖陽，柑橘果香揭開一天的序幕。",
      img: "images/sunrise.jpg",
      fallback: "linear-gradient(135deg,#D98E4A,#A63D2E 55%,#640017)",
      ings: [
        { e:"🍌", n:"香蕉", en:"BANANAS" }, { e:"🍈", n:"芭樂", en:"GUAVA" },
        { e:"🍎", n:"蘋果", en:"APPLE" }, { e:"🥭", n:"芒果", en:"MANGO" },
        { e:"🌾", n:"燕麥片", en:"OATMEALS" }, { e:"🍯", n:"蜂蜜", en:"HONEY" },
        { e:"🥣", n:"希臘優格", en:"YOGURT" },
        { e:"🥛", n:"牛奶", en:"MILK", base:true },
      ]},
    { name: "蒙娜麗莎", en: "Mona Lisa", price: 160, salePrice: 155,
      desc: "神秘微笑般的溫潤層次，莓果與火龍果的柔美和聲。",
      img: "images/monalisa.jpg",
      fallback: "linear-gradient(135deg,#B99B5E,#7A6A3B 55%,#5A5E27)",
      ings: [
        { e:"🍌", n:"香蕉", en:"BANANAS" }, { e:"🐉", n:"火龍果", en:"DRAGON FRUIT" },
        { e:"🥭", n:"芒果", en:"MANGO" }, { e:"🫐", n:"藍莓", en:"BLUEBERRY" },
        { e:"🍓", n:"草莓", en:"STRAWBERRY" }, { e:"🍯", n:"蜂蜜", en:"HONEY" },
        { e:"🌰", n:"堅果", en:"NUTS" }, { e:"🥒", n:"小黃瓜", en:"CUCUMBER" },
        { e:"🥣", n:"希臘優格", en:"YOGURT" },
        { e:"🫘", n:"豆漿", en:"SOY MILK", base:true },
      ]},
    { name: "向日葵", en: "Sunflower", price: 165, salePrice: 160,
      desc: "梵谷筆下的燦爛金黃，柑橘鳳梨盛放於杯中。",
      img: "images/sunflower.jpg",
      fallback: "linear-gradient(135deg,#E8C24A,#C29332 55%,#5A5E27)",
      ings: [
        { e:"🍌", n:"香蕉", en:"BANANAS" }, { e:"🍊", n:"柳橙", en:"ORANGE" },
        { e:"🍋", n:"檸檬", en:"LEMON" }, { e:"🍍", n:"鳳梨", en:"PINEAPPLE" },
        { e:"🍯", n:"蜂蜜", en:"HONEY" }, { e:"🌰", n:"堅果", en:"NUTS" },
        { e:"🥒", n:"小黃瓜", en:"CUCUMBER" },
        { e:"🥣", n:"希臘優格", en:"YOGURT" },
        { e:"🥥", n:"椰子水", en:"COCONUT WATER", base:true },
      ]},
    { name: "最後的晚餐", en: "The Last Supper", price: 165, salePrice: 160,
      desc: "經典飽滿的豐盛之作，莓果酪梨與綠蔬的深邃餘韻。",
      img: "images/supper.jpg",
      fallback: "linear-gradient(135deg,#8A5A3E,#4A2E24 55%,#2F1B1A)",
      ings: [
        { e:"🍌", n:"香蕉", en:"BANANAS" }, { e:"🫐", n:"藍莓", en:"BLUEBERRY" },
        { e:"🥑", n:"酪梨", en:"AVOCADO" }, { e:"🌾", n:"燕麥片", en:"OATMEALS" },
        { e:"🌱", n:"奇亞籽", en:"CHIA SEEDS" }, { e:"🥒", n:"小黃瓜", en:"CUCUMBER" },
        { e:"🌰", n:"堅果", en:"NUTS" }, { e:"🥬", n:"菠菜", en:"SPINACH" },
        { e:"🥣", n:"希臘優格", en:"YOGURT" },
        { e:"🥛", n:"牛奶", en:"MILK", base:true },
      ]},
  ],
};
/* ============================================================ */

const $ = id => document.getElementById(id);
const qty = CONFIG.MENU.map(() => 0);
let cur = 0;

const unitPrice = m => CONFIG.OPENING_SALE ? m.salePrice : m.price;

function priceHTML(m){
  return CONFIG.OPENING_SALE
    ? `<span class="orig">$${m.price}</span><span class="now">$${m.salePrice}</span><span class="tag">開幕價</span>`
    : `<span class="now">$${m.price}</span>`;
}

function renderMenu(){
  $("menuList").innerHTML = CONFIG.MENU.map((m,i)=>`
    <div class="menu-card">
      <div class="art" style="background-image:url('${m.img}'),${m.fallback};background-size:cover" onclick="showDetail(${i})">
        <div class="badge" id="badge${i}"></div>
        <div class="info-hint">口味成份 →</div>
      </div>
      <div class="body">
        <div class="t" onclick="showDetail(${i})">
          <div class="name serif">${m.name}</div>
          <div class="en">${m.en}</div>
        </div>
        <div class="price">
          ${CONFIG.OPENING_SALE ? `<span class="orig">$${m.price}</span>` : ""}
          <span class="now">$${unitPrice(m)}</span>
        </div>
        <div class="stepper">
          <button type="button" onclick="chg(${i},-1)">−</button>
          <div class="qty" id="q${i}">0</div>
          <button type="button" onclick="chg(${i},1)">＋</button>
        </div>
      </div>
    </div>`).join("");
  refreshQty();
}

function refreshQty(){
  CONFIG.MENU.forEach((m,i)=>{
    const q = $("q"+i), b = $("badge"+i);
    if(q) q.textContent = qty[i];
    if(b){ b.style.display = qty[i]>0 ? "flex" : "none"; b.textContent = "×"+qty[i]; }
  });
}

function chg(i,d){
  qty[i] = Math.max(0, Math.min(20, qty[i]+d));
  refreshQty();
  updateBar();
}

function showDetail(i){
  cur = i;
  const m = CONFIG.MENU[i];
  const hero = $("dImg").parentElement;
  hero.style.background = m.fallback;          // 圖片缺失時顯示色卡
  $("dImg").style.display = "block";
  $("dImg").onerror = ()=>{ $("dImg").style.display="none"; hero.style.height="250px"; };
  $("dImg").src = m.img;
  $("dName").textContent = m.name;
  $("dEn").textContent = m.en;
  $("dDesc").textContent = m.desc;
  $("dPrice").innerHTML = priceHTML(m);
  $("dIngs").innerHTML = m.ings.map(g=>`
    <div class="ing${g.base?" base":""}">
      <div class="ph">
        <img src="images/ings/${g.en.toLowerCase().replace(/\s+/g,"")}.jpg" alt="${g.n}" loading="lazy"
             onerror="this.parentElement.innerHTML='<span class=&quot;e&quot;>${g.e}</span>'">
      </div>
      <div class="cap">
        <div class="n">${g.n}</div>
        <div class="en-s">${g.en}</div>
      </div>
    </div>`).join("");
  $("scMenu").classList.remove("active");
  $("scDetail").classList.add("active");
  window.scrollTo(0,0);
}

function showMenu(){
  $("scDetail").classList.remove("active");
  $("scMenu").classList.add("active");
  refreshQty();
  window.scrollTo(0,0);
}

function totals(){
  let cups=0, amt=0;
  CONFIG.MENU.forEach((m,i)=>{ cups+=qty[i]; amt+=qty[i]*unitPrice(m); });
  return {cups, amt};
}

function updateBar(){
  const {cups, amt} = totals();
  $("barCups").textContent = `共 ${cups} 杯`;
  $("barAmt").textContent = `$${amt}`;
  $("barBtn").disabled = cups===0;
}

function renderTimeWheels(){
  const hOpts = [];
  for(let h=CONFIG.OPEN_HOUR; h<CONFIG.CLOSE_HOUR; h++){
    hOpts.push(`<option value="${h}">${String(h).padStart(2,"0")}</option>`);
  }
  $("fHour").innerHTML = hOpts.join("");

  const mOpts = [];
  for(let m=0; m<60; m+=CONFIG.SLOT_MINUTES){
    mOpts.push(`<option value="${m}">${String(m).padStart(2,"0")}</option>`);
  }
  $("fMinute").innerHTML = mOpts.join("");
}

$("fAsap").addEventListener("change", ()=>{
  $("timeWheels").classList.toggle("disabled", $("fAsap").checked);
});

function renderSum(){
  const {cups, amt} = totals();
  let html = "";
  CONFIG.MENU.forEach((m,i)=>{
    if(qty[i]>0) html += `<div class="row"><span>${m.name} ×${qty[i]}</span><span>$${qty[i]*unitPrice(m)}</span></div>`;
  });
  html += `<div class="row total"><span>合計 ${cups} 杯</span><span>$${amt}</span></div>`;
  $("orderSum").innerHTML = html;
}

function buildOrder(){
  const lines = ["🍹 果藝所 訂單", "━━━━━━━━━━"];
  CONFIG.MENU.forEach((m,i)=>{
    if(qty[i]>0) lines.push(`${m.name} ×${qty[i]}　$${qty[i]*unitPrice(m)}`);
  });
  const {cups, amt} = totals();
  lines.push("━━━━━━━━━━");
  lines.push(`合計：${cups} 杯　$${amt}`);
  const timeStr = $("fAsap").checked
    ? "儘快取餐（現場稍後）"
    : `${String($("fHour").value).padStart(2,"0")}:${String($("fMinute").value).padStart(2,"0")}`;
  lines.push(`取餐時間：${timeStr}`);
  const name = $("fName").value.trim(), phone = $("fPhone").value.trim(), note = $("fNote").value.trim();
  if(name)  lines.push(`姓名：${name}`);
  if(phone) lines.push(`電話：${phone}`);
  if(note)  lines.push(`備註：${note}`);
  return lines.join("\n");
}

$("barBtn").addEventListener("click", ()=>{
  renderSum();
  $("overlay").classList.add("show");
});

function closeSheet(){ $("overlay").classList.remove("show"); }

$("btnSend").addEventListener("click", ()=>{
  if(!$("fName").value.trim()){ alert("請填寫姓名，方便叫號取餐 🙏"); $("fName").focus(); return; }
  if(!$("fPhone").value.trim()){ alert("請填寫電話，方便聯繫您 🙏"); $("fPhone").focus(); return; }
  const oa = CONFIG.OA_ID.replace(/^@?/, "@");
  if(oa.includes("請填入")){
    alert("店家尚未設定官方帳號 ID（請在檔案內 CONFIG.OA_ID 填入）");
    return;
  }
  location.href = `https://line.me/R/oaMessage/${encodeURIComponent(oa)}/?${encodeURIComponent(buildOrder())}`;
});

renderMenu();
renderTimeWheels();
updateBar();
</script>
</body>
</html>
